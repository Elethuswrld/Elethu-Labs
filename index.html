<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elethu Labs | Interactive Developer Experiments</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>
    <img class="image-gradient" src="/assets/Images/gradient.png" alt="gradient">
    <div class="layer-blur"></div>

    <div class="container">
        <header>
            <h1 data-aos="fade-down" data-aos-duration="1500" class="logo">Elethuswrld</h1>

            <nav>
                <a data-aos="fade-down" data-aos-duration="1500" href="Portfolio">Projects</a>
                <a data-aos="fade-down" data-aos-duration="2000" href="Features">Experiments</a>
                <a data-aos="fade-down" data-aos-duration="2500" href="Resources">Tools</a>
                <a data-aos="fade-down" data-aos-duration="3000" href="Docs">Open Source</a>
            </nav>

            <button data-aos="fade-down" data-aos-duration="1500" class="btn-signing">Sign In</button>
        </header>

        <main>
            <div class="content">
                <div data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="1500" class="tag-box">
                    <div class="tag">Interactive Developer Lab ⚡</div>
                </div>

                <h1 data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="2000"> Welcome to <br> Elethu's Lab</h1>

                <p data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="2500" class="description">A space where ideas become software — explore my projects, tools, and experiments.</p>

                <div data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="3000" class="buttons">
                    <a href="#" class="btn-get-started">Explore Projects &gt;</a>
                    <a href="#" class="btn-signing-main">Enter the Lab &gt;</a>
                </div>
            </div>
        </main>

        <spline-viewer data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="3000" class="robot-3d" url="https://prod.spline.design/sGD-9honwi-A-Nyy/scene.splinecode"></spline-viewer>

    </div>

    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.69/build/spline-viewer.js"></script>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
    AOS.init();
    </script>
</body>
</html>
